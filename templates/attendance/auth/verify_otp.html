{% extends 'layouts/base-auth.html' %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-content">
        <div class="auth-bg">
            <span class="r"></span><span class="r s"></span><span class="r s"></span><span class="r"></span>
        </div>
        <div class="card">
            <form method="post" class="card-body text-center" action="">
                {% csrf_token %}
                <div class="mb-4">
                    <i class="feather icon-user-plus auth-icon"></i>
                </div>
                <h3 class="mb-4">Code OTP</h3>
                <p>Veuillez entrer le code reçu par WhatsApp.</p>
                
                {{ form.non_field_errors }}
                
                {% for field in form %}
                    <div class="input-group mb-3">{{ field }}</div>
                    <span class="text-danger d-block text-left">{{ field.errors }}</span>
                {% endfor %}

                <button type="submit" class="btn btn-primary shadow-2 mb-4">Vérifier le code</button>
                <p class="mb-0 text-muted">
                    Vous n'avez pas reçu le code ? <a href="{% url 'attendance:request-otp' %}">Renvoyer</a>
                </p>
            </form>
        </div>
    </div>
</div>
{% endblock %}

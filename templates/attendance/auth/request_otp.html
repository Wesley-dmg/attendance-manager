{% extends 'layouts/base-auth.html' %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-content">
        <div class="auth-bg">
            <span class="r"></span><span class="r s"></span><span class="r s"></span><span class="r"></span>
        </div>
        <div class="card">
            <form method="post" class="card-body text-center" action="{% url "request-otp" %}">
                {% csrf_token %}
                <div class="mb-4">
                    <i class="feather icon-user auth-icon"></i>
                </div>
                <h3 class="mb-4">Connexion</h3>
                <p>Entrez votre numéro de téléphone pour recevoir un code via whatsapp.</p>

                {% for field in form %}
                    <div class="input-group mb-3">{{ field }}</div>
                    <span class="text-danger d-block text-left">{{ field.errors }}</span>
                {% endfor %}

                <button type="submit" class="btn btn-primary shadow-2 mb-4">Envoyer le code</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

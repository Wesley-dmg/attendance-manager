<script type="text/javascript">
    $(document).ready(function() {
        {% for message in messages %}
            // Type et contenu du message
            var messageType = "{{ message.tags }}"; // 'success', 'info', 'warning', 'error'
            var messageContent = "{{ message }}";
            
            // Définir une icône en fonction du type de message
            var icon = '';
            if (messageType === 'success') {
                icon = 'check-circle';
            } else if (messageType === 'error') {
                icon = 'x-circle';
            } else if (messageType === 'warning') {
                icon = 'alert-circle';
            } else {
                icon = 'info';
            }

            // Affichage du message avec Bootstrap Notify
            $.notify({
                icon: '<i data-feather="' + icon + '" class="notify-icon"></i>', // Icône Feather avec taille contrôlée
                message: messageContent
            }, {
                type: messageType, // 'success', 'info', 'warning', 'danger'
                delay: 5000, // Durée de l'affichage (en ms)
                placement: {
                    from: 'top', 
                    align: 'center' 
                },
                z_index: 9999, // Assurez-vous que la notification apparaisse au-dessus du contenu
                animate: {
                    enter: 'animated fadeInDown', // Animation d'entrée
                    exit: 'animated fadeOutUp' // Animation de sortie
                },
                offset: {
                    x: 0, // Décalage horizontal (centré)
                    y: 10 // Décalage vertical (espacement entre les notifications)
                }
            });

            // Initialiser Feather icons après l'insertion de la notification
            feather.replace();
        {% endfor %}
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Action lorsque le bouton "Disponible" est cliqué
        document.querySelector('#accept-request').addEventListener('click', function(e) {
            e.preventDefault();
            var requestId = this.getAttribute('data-id');
            
            // Requête fetch pour accepter la demande
            fetch("{% url 'availability:accept_availability_request' 0 %}".replace('0', requestId), {
                method: 'GET',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'  // Permet d'identifier une requête AJAX
                }
            })
            .then(response => response.json())  // On attend la réponse en JSON
            .then(data => {
                if (data.status === 'success') {
                    // Mise à jour du message de succès
                    document.querySelector('#message').innerHTML = '<div class="alert alert-success">' + data.message + '</div>';

                    // Recharger la page après un délai (par exemple, 1 seconde)
                    setTimeout(function() {
                        location.reload(); // Recharger la page pour afficher les données mises à jour
                    }, 1000);  // Délai d'1 seconde
                } else {
                    // Si la réponse est une erreur
                    document.querySelector('#message').innerHTML = '<div class="alert alert-danger">' + data.message + '</div>';
                }
            })
            .catch(error => {
                // Gestion des erreurs
                document.querySelector('#message').innerHTML = '<div class="alert alert-danger">Erreur lors du traitement de la demande.</div>';
            });
        });

        // Action lorsque le bouton "Indisponible" est cliqué
        document.querySelector('#reject-request').addEventListener('click', function(e) {
            e.preventDefault();
            var requestId = this.getAttribute('data-id');
            
            // Requête fetch pour rejeter la demande
            fetch("{% url 'availability:reject_availability_request' 0 %}".replace('0', requestId), {
                method: 'GET',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'  // Permet d'identifier une requête AJAX
                }
            })
            .then(response => response.json())  // On attend la réponse en JSON
            .then(data => {
                if (data.status === 'success') {
                    // Mise à jour du message de succès
                    document.querySelector('#message').innerHTML = '<div class="alert alert-success">' + data.message + '</div>';

                    // Recharger la page après un délai (par exemple, 1 seconde)
                    setTimeout(function() {
                        location.reload(); // Recharger la page pour afficher les données mises à jour
                    }, 1000);  // Délai d'1 seconde
                } else {
                    // Si la réponse est une erreur
                    document.querySelector('#message').innerHTML = '<div class="alert alert-danger">' + data.message + '</div>';
                }
            })
            .catch(error => {
                // Gestion des erreurs
                document.querySelector('#message').innerHTML = '<div class="alert alert-danger">Erreur lors du traitement de la demande.</div>';
            });
        });
    });
</script>

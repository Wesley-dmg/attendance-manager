{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
<div class="card container mt-4">
  <div class="card-header">
    <h5 class="mb-4">{{title}}</h5>
    <a href="{% url 'availability:availability_request_list' %}" class="px-4 py-1 btn-secondary float-right ">Retour</a>
  </div>
  <!-- Bloc de sélection : matière et enseignants -->
  <div id="selection-container" class="row {% if availability_request %}d-none{% endif %}">
    <!-- Sélection de la matière (via select2) -->
    <div id="subject-selection" class="col-md-4 card">
      <div class="card-header">
        <h5 class="mb-3">Choisissez une matière</h5>
      </div>
      <div class="p-3">
        <select id="subject-select" class="form-control select2">
          <option value="">Sélectionnez une matière</option>
          {% for subject in subjects %}
            <option value="{{ subject.id }}"
              {% if availability_request and availability_request.subject.id == subject.id %}selected{% endif %}>
              {{ subject.name }}
            </option>
          {% endfor %}
        </select>
      </div>
    </div>
    <!-- Liste des enseignants (chargée dynamiquement) -->
    <div id="teachers-container" class="col-md-8 mx-auto d-none card">
      <div class="card-header">
        <h5 class="mb-3">Sélectionnez des enseignants</h5>
      </div>
      <div class="p-3" id="teachers-list">
        <!-- Les enseignants seront affichés ici via JS -->
      </div>
      <button type="button" class="btn btn-primary mt-3" id="show-form" disabled>Faire une demande</button>
    </div>
  </div>

  <!-- Formulaire (étape 2) -->
  <div class="row col-md-8 d-flex justify-content-center">
    <div id="form-container" class="card col-md-8 {% if not availability_request %}d-none{% endif %}">
      <div class="card-header">
        <h5 class="mb-3">Remplissez le formulaire</h5>
      </div>
      <form id="availability-form" method="POST" action="{{ form_action_url }}">
        {% csrf_token %}
        <!-- Champs cachés pour la matière et les enseignants -->
        <input type="hidden" name="subject_id" id="hidden-subject-id" value="{% if availability_request %}{{ availability_request.subject.id }}{% endif %}">
        <input type="hidden" name="teacher_ids" id="hidden-teacher-ids" value="{% if availability_request %}{% for teacher in availability_request.teachers.all %}{{ teacher.id }}{% if not forloop.last %},{% endif %}{% endfor %}{% endif %}">
        
        <input type="hidden" id="hidden-filiere-ids" value="{% if availability_request %}{% for filiere in availability_request.filieres.all %}{{ filiere.id }}{% if not forloop.last %},{% endif %}{% endfor %}{% endif %}">

        <!-- Dates de début et de fin -->
        <div class="mb-3">
          <label for="start_date">Date de début :</label>
          <input type="date" class="form-control" name="start_date" id="start_date" required
                 value="{% if availability_request %}{{ availability_request.start_date|date:'Y-m-d' }}{% endif %}">
        </div>
        <div class="mb-3">
          <label for="end_date">Date de fin :</label>
          <input type="date" class="form-control" name="end_date" id="end_date" required
                 value="{% if availability_request %}{{ availability_request.end_date|date:'Y-m-d' }}{% endif %}">
        </div>

        <!-- Sélection multiple des filières -->
        <div class="mb-3">
          <label for="filiere-select">Filières :</label>
          <select id="filiere-select" name="filiere_ids" multiple class="form-control">
            {% if availability_request %}
              {% for filiere in availability_request.filieres.all %}
                <option value="{{ filiere.id }}" selected>{{ filiere }}</option>
              {% endfor %}
            {% endif %}
            <!-- Les autres options seront chargées via AJAX -->
          </select>
        </div>

        <button type="submit" class="btn btn-primary">
          {% if availability_request %}Modifier la demande{% else %}Envoyer la demande{% endif %}
        </button>
        <button type="button" class="btn btn-secondary" id="back-to-selection" title="Retour"><i class="feather icon-arrow-right"></i></button>
      </form>
    </div>
  </div>
</div>
{% endblock content %}

{% block extra_js %}
<script>
$(document).ready(function () {
  let $subjectSelect = $('#subject-select');
  let $teacherList = $('#teachers-list');
  let $teachersContainer = $('#teachers-container');
  let $showFormButton = $('#show-form');
  let $formContainer = $('#form-container');
  let $selectionContainer = $('#selection-container');
  let $backToSelectionButton = $('#back-to-selection');
  let $hiddenSubjectId = $('#hidden-subject-id');
  let $hiddenTeacherIds = $('#hidden-teacher-ids');
  let $filiereSelect = $('#filiere-select');
  let $hiddenFiliereIds = $('#hidden-filiere-ids');

  let selectedSubject = $hiddenSubjectId.val() || null;
  let selectedTeachers = $hiddenTeacherIds.val() ? $hiddenTeacherIds.val().split(",") : [];

  // Initialiser select2
  $subjectSelect.select2({
    placeholder: "Sélectionnez une matière",
    allowClear: true,
    width: '100%'
  });

  if (!selectedSubject) {
    $selectionContainer.removeClass("d-none");
    $formContainer.addClass("d-none");
  }

  // Changement de matière
  $subjectSelect.on("change", function () {
    selectedSubject = $(this).val();
    if (!selectedSubject) {
      $teacherList.html('');
      $teachersContainer.addClass("d-none");
      return;
    }

    console.log("Matière sélectionnée :", selectedSubject);
    $.ajax({
      url: '/availability/ajax/get-teachers/',
      data: { subject_id: selectedSubject },
      dataType: 'json',
      success: function (data) {
        console.log("Données enseignants :", data);
        $teacherList.empty();
        selectedTeachers = [];
        $showFormButton.prop('disabled', true);

        if (data.teachers && data.teachers.length > 0) {
          data.teachers.forEach(function (teacher) {
            let checkboxHTML = `
              <div class="form-check my-4">
                <input type="checkbox" class="form-check-input teacher-checkbox" id="teacher-${teacher.id}" value="${teacher.id}">
                <label class="mx-2 form-check-label" for="teacher-${teacher.id}">${teacher.name}</label>
              </div>
            `;
            $teacherList.append(checkboxHTML);
          });

          $(".teacher-checkbox").on("change", function () {
            let teacherId = $(this).val();
            if ($(this).is(':checked')) {
              if (!selectedTeachers.includes(teacherId)) {
                selectedTeachers.push(teacherId);
              }
            } else {
              selectedTeachers = selectedTeachers.filter(id => id !== teacherId);
            }
            console.log("Enseignants sélectionnés :", selectedTeachers);
            $showFormButton.prop('disabled', selectedTeachers.length === 0);
          });

          $teachersContainer.removeClass("d-none");
        } else {
          $teacherList.html("<p>Aucun enseignant disponible.</p>");
        }
      },
      error: function (xhr, status, error) {
        console.error("Erreur AJAX enseignants :", status, error);
      }
    });
  });

  // Chargement des filières via AJAX (réutilisable)
  function loadFilieres(preselect = []) {
    $.ajax({
      url: '/availability/ajax/get-filieres/',
      data: { subject_id: selectedSubject },
      dataType: 'json',
      success: function (data) {
        console.log("Données filières :", data);
        $filiereSelect.empty();
        if (data.filieres && data.filieres.length > 0) {
          data.filieres.forEach(function (filiere) {
            let isSelected = preselect.includes(String(filiere.id));
            let option = new Option(filiere.name, filiere.id, isSelected, isSelected);
            $filiereSelect.append(option);
          });
        } else {
          $filiereSelect.append(new Option("Aucune filière disponible", "", false, false));
        }
        $filiereSelect.select2({
          placeholder: "Sélectionnez des filières",
          allowClear: true,
          width: '100%'
        });
      },
      error: function (xhr, status, error) {
        console.error("Erreur AJAX filières :", status, error);
      }
    });
  }

  // Mode modification : charger enseignants + filières
  if (selectedSubject) {
    $subjectSelect.val(selectedSubject).trigger('change');
    $.ajax({
      url: '/availability/ajax/get-teachers/',
      data: { subject_id: selectedSubject },
      dataType: 'json',
      success: function (data) {
        $teacherList.empty();
        if (data.teachers && data.teachers.length > 0) {
          data.teachers.forEach(function (teacher) {
            let isChecked = selectedTeachers.includes(String(teacher.id));
            let checkboxHTML = `
              <div class="form-check my-4">
                <input type="checkbox" class="form-check-input teacher-checkbox" id="teacher-${teacher.id}" value="${teacher.id}" ${isChecked ? 'checked' : ''}>
                <label class="mx-2 form-check-label" for="teacher-${teacher.id}">${teacher.name}</label>
              </div>
            `;
            $teacherList.append(checkboxHTML);
          });

          $(".teacher-checkbox").on("change", function () {
            let teacherId = $(this).val();
            if ($(this).is(':checked')) {
              if (!selectedTeachers.includes(teacherId)) {
                selectedTeachers.push(teacherId);
              }
            } else {
              selectedTeachers = selectedTeachers.filter(id => id !== teacherId);
            }
            $showFormButton.prop('disabled', selectedTeachers.length === 0);
          });

          $teachersContainer.removeClass("d-none");
        } else {
          $teacherList.html("<p>Aucun enseignant disponible.</p>");
        }
      },
      error: function (xhr, status, error) {
        console.error("Erreur AJAX enseignants :", status, error);
      }
    });

    let preselectedFilieres = $hiddenFiliereIds.val() ? $hiddenFiliereIds.val().split(",") : [];
    loadFilieres(preselectedFilieres);
  }

  // Bouton : Passer au formulaire
  $showFormButton.on("click", function () {
    $hiddenSubjectId.val(selectedSubject);
    $hiddenTeacherIds.val(selectedTeachers.join(","));
    $selectionContainer.addClass("d-none");
    $formContainer.removeClass("d-none");

    loadFilieres([]);
  });

  // Bouton Retour
  $backToSelectionButton.on("click", function () {
    $formContainer.addClass("d-none");
    $selectionContainer.removeClass("d-none");
  });
});
</script>
{% endblock extra_js %}

<h1>Vos demandes de disponibilités</h1>
<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Matière</th>
            <th>Date</th>
            <th>Jours</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for request in requests %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ request.subject.name }}</td>
            <td>{{ request.created_at|date:"d/m/Y" }}</td>
            <td>{{ request.days|join:", " }}</td>
            <td>
                <a href="{% url 'teacher_request_detail' request.id %}">Voir</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

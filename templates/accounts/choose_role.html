{% extends 'layouts/base-auth.html' %}
{% load static %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-content">
        <div class="auth-bg">
            <span class="r"></span>
            <span class="r s"></span>
            <span class="r s"></span>
            <span class="r"></span>
        </div>
        <div class="card">
            <div class="card-body text-center">

                <div class="mb-4">
                    <i class="feather icon-unlock auth-icon"></i>
                </div>
                <h3 class="mb-4">Connexion</h3>
                <p class="mb-4 text-muted">Se connecter en tant que :</p>

                <div class="d-grid gap-3">

                    <!-- Bouton Admin -->
                    <a href="{% url 'users:login' %}" class="btn btn-outline-primary d-flex justify-content-between align-items-center">
                        <i class="feather icon-shield"></i>
                        <span>Administrateur</span>
                        <i class="feather icon-arrow-right"></i>
                    </a>

                    <!-- Bouton Enseignant -->
                    <a href="{% url 'attendance:request-otp' %}" class="btn btn-outline-success d-flex justify-content-between align-items-center">
                        <i class="feather icon-arrow-left"></i>
                        <span>Enseignant</span>
                        <i class="feather icon-user"></i>
                    </a>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}

{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
    <div class="row">
      <div class="col-xl-12">
        <div class="card">
          <div class="card-header">
            <h5>Liste des Matières</h5>
            <a href=" {% url create_url %}" class="btn btn-primary float-right">Ajouter une Matière</a>
          </div>
          <div class="card-block table-border-style">
            <div class="table-responsive">
              <table class="table table-hover dataTable">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nom</th>
                    <th scope="col">Code</th>
                    <th scope="col">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {% for subject in object_list %}
                  <tr>
                    <th scope="row">{{ forloop.counter }}</th>
                    <td>{{ subject.name }}</td>
                    <td>{{ subject.code }}</td>
                    <td>
                      <a href="{% url edit_url subject.pk %}" class="btn btn-warning btn-sm">Modifier</a>
                      <a href="{% url delete_url subject.pk %}" class="btn btn-danger btn-sm">Supprimer</a>
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
{% endblock content %}

{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <input
        type="text"
        id="parent-search"
        class="form-control form-control-lg"
        placeholder="Rechercher un parent (nom, prénom ou téléphone)..."
        autocomplete="off"
        data-student-id="{{ student_id|default:''|escapejs }}"
      >
    </div>
  </div>

  <div class="mt-4" id="parent-results">
    {% include "users/partials/_parent_cards.html" with parents=parents student_id=student_id query=query %}
  </div>
</div>

<script>
(function(){
  const input = document.getElementById("parent-search");
  const results = document.getElementById("parent-results");
  const studentId = input.dataset.studentId || "";
  const searchUrl = "{% url 'users:parent_search' %}";

  let timer = null;
  input.addEventListener("input", function(e){
    clearTimeout(timer);
    timer = setTimeout(() => {
      const q = e.target.value.trim();
      const url = `${searchUrl}?q=${encodeURIComponent(q)}&student_id=${encodeURIComponent(studentId)}`;

      fetch(url, { headers: { "x-requested-with": "XMLHttpRequest" } })
        .then(resp => resp.json())
        .then(data => {
          results.innerHTML = data.html;
        })
        .catch(err => {
          console.error("parent search error", err);
        });
    }, 250);
  });
})();
</script>
{% endblock %}

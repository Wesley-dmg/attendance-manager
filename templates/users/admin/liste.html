{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}
<div class="container mt-4">
    <!-- En-tête : titre, recherche et bouton -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h5 class="mb-0" style="font-size: 1.6rem; font-weight: 600;">{{ title }}</h5>

        <input type="text" id="search-input" value="{{ request.GET.q }}" class="form-control w-50" placeholder="Rechercher par nom, prénom ou téléphone">

        <a href="{{ create_url }}" class="btn btn-primary d-flex align-items-center">
            <i class="feather icon-plus mr-2"></i> Ajouter
        </a>
        {% if role == "student" %}
            <div class="mb-3">
                <select id="filiere-filter" class="form-control">
                    <option value="">Toutes les filières</option>
                    {% for filiere in filieres %}
                        <option value="{{ filiere.id }}">{{ filiere.get_full_description }}</option>
                    {% endfor %}
                </select>
            </div>
        {% endif %}
    </div>

    <!-- Zone des cartes utilisateurs (AJAX update ici) -->
    <div class="row mt-3" id="user-cards">
        {% include "users/partials/_user_cards.html" %}
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("search-input");
        const filiereSelect = document.getElementById("filiere-filter");
        const userContainer = document.getElementById("user-cards");
        const role = "{{ role|default:'' }}";
        const searchUrl = "{% url 'users:user_search' %}";

        let timer = null;

        function doSearch() {
            const query = searchInput ? searchInput.value.trim() : "";
            const filiereId = filiereSelect ? filiereSelect.value : "";

            const params = new URLSearchParams({
                q: query,
                role: role,
                filiere: filiereId
            });

            fetch(`${searchUrl}?${params.toString()}`, {
                method: "GET",
                credentials: "same-origin",
                headers: { "X-Requested-With": "XMLHttpRequest" }
            })
            .then(response => {
                if (!response.ok) throw new Error("HTTP " + response.status);
                return response.json();
            })
            .then(data => {
                userContainer.innerHTML = data.html;
            })
            .catch(error => {
                console.error("Erreur AJAX:", error);
            });
        }

        // Recherche (avec debounce)
        if (searchInput) {
            searchInput.addEventListener("input", function () {
                clearTimeout(timer);
                timer = setTimeout(doSearch, 300);
            });
        }

        // Filtre filière
        if (filiereSelect) {
            filiereSelect.addEventListener("change", doSearch);
        }
    });
</script>
{% endblock %}

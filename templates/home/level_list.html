{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
<div class="row">
    <div class="col-xl-12">
        <div class="card">
            <div class="card-header">
                <h5>Liste des Niveaux d'Études</h5>
                <a href="{% url 'home:level_add' %}" class="btn btn-primary float-right">Ajouter un Niveau</a>
            </div>
            <div class="card-block table-border-style">
                <div class="table-responsive">
                    <table class="table datatable">
                        <thead>
                            <tr>
                                <th scope="col" >#</th>
                                <th scope="col" >Nom du Niveau</th>
                                <th scope="col" >Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for level in object_list %}
                            <tr>
                                <td>{{ forloop.counter }}</td>
                                <td>{{ level.name }}</td>
                                <td>
                                    <a href="{% url 'home:level_edit' level.id %}" class="btn btn-sm btn-warning">Modifier</a>
                                    <a href="{% url 'home:level_delete' level.id %}" class="btn btn-sm btn-danger">Supprimer</a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow rounded-4 p-4" style="max-width: 600px; width: 100%;">
        <h3 class="text-center mb-4 fw-bold">Importer des Données</h3>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Type de données à importer -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Type de données :</label>
                <div class="d-flex">
                    <div class="form-check mx-2">
                        <input class="form-check-input" type="radio" name="data_type" id="filiere" value="filiere" required>
                        <label class="form-check-label" for="filiere">Filières</label>
                    </div>
                    <div class="form-check mx-2 ">
                        <input class="form-check-input" type="radio" name="data_type" id="teacher" value="teacher">
                        <label class="form-check-label" for="teacher">Enseignants</label>
                    </div>
                    <div class="form-check mx-2">
                        <input class="form-check-input" type="radio" name="data_type" id="student" value="student">
                        <label class="form-check-label" for="student">Étudiants</label>
                    </div>
                    <div class="form-check mx-2">
                        <input class="form-check-input" type="radio" name="data_type" id="subject" value="subject">
                        <label class="form-check-label" for="subject">Matières</label>
                    </div>
                </div>
            </div>

            <!-- Upload fichier -->
            <div class="mb-4">
                <label for="excel_file" class="form-label fw-semibold">Fichier Excel :</label>
                <input class="form-control" type="file" name="excel_file" id="excel_file" accept=".xls,.xlsx" required>
            </div>

            <!-- Bouton d'import -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="feather icon-upload"></i> Importer
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

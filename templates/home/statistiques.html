{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
<div class="row">
  <div class="col-xl-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5>Statistiques des Absences</h5>
        <form method="get" class="form-inline">
          <!-- Filtre Période -->
          <div class="btn-group mb-2 mr-2">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-toggle="dropdown"
              aria-haspopup="true" aria-expanded="false">
              {{ request.GET.periode|default:"Période" }}
            </button>
            <div class="dropdown-menu">
              <button type="submit" name="periode" value="semaine" class="dropdown-item">Cette semaine</button>
              <button type="submit" name="periode" value="mois" class="dropdown-item">Ce mois</button>
              <button type="submit" name="periode" value="annee" class="dropdown-item">Cette année</button>
            </div>
          </div>

          <!-- Filtre Type -->
          <div class="btn-group mb-2 mr-2">
            <button class="btn btn-primary dropdown-toggle" type="button" data-toggle="dropdown"
              aria-haspopup="true" aria-expanded="false">
              {{ request.GET.vue|default:"Vue par" }}
            </button>
            <div class="dropdown-menu">
              <button type="submit" name="vue" value="filiere" class="dropdown-item">Par Filière</button>
              <button type="submit" name="vue" value="matiere" class="dropdown-item">Par Matière</button>
              <button type="submit" name="vue" value="Matiere/filiere" class="dropdown-item">Par Matière / Filière</button>
            </div>
          </div>
        </form>
      </div>

      <div class="card-block table-responsive p-3"> 
        <div id="stats-table">
          {% include "home/partials/_statistiques_table.html" %}
        </div>
      </div>
    </div>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.querySelector("form");
  const tableDiv = document.getElementById("stats-table");

  form.addEventListener("change", function (e) {
    e.preventDefault();
    const url = form.action + "?" + new URLSearchParams(new FormData(form)).toString();
    fetch(url, { headers: { "X-Requested-With": "XMLHttpRequest" } })
      .then(res => res.text())
      .then(html => {
        tableDiv.innerHTML = html;
      });
  });
});
</script>

{% endblock content %}

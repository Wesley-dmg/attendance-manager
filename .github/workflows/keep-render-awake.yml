name: 🔄 Garder Render éveillé

on:
  schedule:
    - cron: '*/12 * * * *'  # Plus fiable à 12 min
  workflow_dispatch:

jobs:
  wake-up-render:
    runs-on: ubuntu-latest
    steps:
      - name: Réveil en douceur
        run: |
          echo "🌅 $(date) - Processus de réveil"
          
          # Tentative 1 - timeout long
          curl -I https://timelya.onrender.com/ \
            --connect-timeout 90 \
            --max-time 180 \
            --retry 2 \
            --retry-delay 10 \
            --retry-max-time 100 \
            -A "Render-Waker/1.0" \
            -o /dev/null \
            -s -w "Tentative 1: %{http_code}\n" \
            || echo "Tentative 1: timeout (normal si réveil)"
          
          # Attendre que Render finisse de démarrer
          echo "⏳ Pause de 15 secondes pour finaliser le réveil..."
          sleep 15
          
          # Tentative 2 - vérification
          echo "✅ $(date) - Vérification post-réveil"
          curl -I https://timelya.onrender.com/ \
            --connect-timeout 30 \
            --max-time 30 \
            -A "Render-Waker/1.0" \
            -o /dev/null \
            -s -w "Vérification: %{http_code}\n" \
            --fail
          
      - name: Status
        run: echo "🎉 Site réveillé avec succès à $(date)"